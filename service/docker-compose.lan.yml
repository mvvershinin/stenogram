# Запись заливается в локальный MinIO с другого компьютера (service/transcribe.sh).
# Подключается через COMPOSE_FILE в .env вместе с docker-compose.minio.yml. edge — та же
# сеть без исходящего NAT, что у api: порт публикуется, а выхода в интернет у контейнера нет.
services:
  minio:
    networks: [storage, edge]
    ports:
      - "${STENOGRAM_S3_PORT:-9000}:9000"
